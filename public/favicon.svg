<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Three stacked noteheads on one stem: a vocal trio -->
  <rect width="32" height="32" rx="7" fill="#18181b"/>
  <g fill="#fafafa">
    <ellipse cx="13" cy="24.5" rx="4.3" ry="3" transform="rotate(-20 13 24.5)"/>
    <ellipse cx="13" cy="16.5" rx="4.3" ry="3" transform="rotate(-20 13 16.5)"/>
    <rect x="16.3" y="3.5" width="1.7" height="20" rx="0.85"/>
  </g>
  <ellipse cx="13" cy="8.5" rx="4.3" ry="3" transform="rotate(-20 13 8.5)" fill="#3b82f6"/>
</svg>
